<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plated — Macro &amp; Supplement Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #16171a;
    --surface: #1f2023;
    --surface-2: #26272b;
    --surface-3: #2e3035;
    --border: #34363b;
    --text: #eef0f2;
    --text-dim: #9599a1;
    --hazard: #f5c518;
    --red: #e0483c;
    --blue: #3b82c4;
    --gold: #e0ab2b;
    --steel: #8b909a;
    --green: #35c26a;
    --danger: #e0483c;
    --font-display: 'Bebas Neue', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background-color: var(--bg);
    background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 10px);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
  }
  h1, h2, h3, .display { font-family: var(--font-display); letter-spacing: 0.03em; font-weight: 400; }
  .mono { font-family: var(--font-mono); }
  a { color: var(--hazard); }
  button { font-family: inherit; }
  .hidden { display: none !important; }

  .hazard-divider { height: 6px; background-image: repeating-linear-gradient(135deg, var(--hazard) 0 10px, #161200 10px 20px); }

  /* ── Buttons / inputs ─────────────────────────────────────────── */
  .btn { font-weight: 600; border-radius: 8px; padding: 0.65rem 1.1rem; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); cursor: pointer; transition: filter .15s, border-color .15s; font-size: 0.92rem; }
  .btn:hover { border-color: var(--hazard); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--hazard); color: #1a1500; border-color: var(--hazard); }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-danger { background: transparent; border-color: var(--red); color: var(--red); }
  .btn-danger:hover { background: rgba(224,72,60,0.1); }
  .btn-ghost { background: transparent; border-color: transparent; }
  .btn-sm { padding: 0.35rem 0.7rem; font-size: 0.8rem; }
  .btn-block { width: 100%; }
  .input, select, textarea {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 0.6rem 0.8rem; font-family: inherit; width: 100%; font-size: 0.92rem;
  }
  textarea { resize: vertical; min-height: 4.5rem; }
  label { display: block; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 0.3rem; font-weight: 600; }
  .field { margin-bottom: 0.9rem; }
  .row { display: flex; gap: 0.75rem; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 120px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem; margin-bottom: 1rem; }
  .card h3 { margin: 0 0 0.75rem; font-size: 1.3rem; }
  .muted { color: var(--text-dim); font-size: 0.85rem; }
  .toast { position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%); background: var(--surface-3);
    border: 1px solid var(--hazard); color: var(--text); padding: 0.7rem 1.2rem; border-radius: 10px; z-index: 999;
    font-size: 0.9rem; max-width: 90vw; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.72rem; font-weight: 700;
    letter-spacing: 0.03em; background: var(--surface-3); color: var(--text-dim); }
  .badge.on { color: #1a1500; background: var(--hazard); }

  /* ── Auth screen ──────────────────────────────────────────────── */
  #authScreen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
  .auth-box { width: 100%; max-width: 380px; }
  .auth-logo { text-align: center; font-size: 3rem; color: var(--hazard); margin-bottom: 0.1rem; }
  .auth-tagline { text-align: center; color: var(--text-dim); margin-bottom: 1.75rem; font-size: 0.9rem; }
  .auth-toggle { display: flex; margin-bottom: 1.25rem; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .auth-toggle button { flex: 1; padding: 0.6rem; background: var(--surface); border: none; color: var(--text-dim); cursor: pointer; font-weight: 600; }
  .auth-toggle button.active { background: var(--hazard); color: #1a1500; }
  #authError { color: var(--red); font-size: 0.85rem; margin-top: 0.5rem; min-height: 1em; }
  #authNote { color: var(--green); font-size: 0.85rem; margin-top: 0.5rem; min-height: 1em; }
  .consent-line { font-size: 0.78rem; color: var(--text-dim); margin-top: 0.75rem; display: flex; gap: 0.4rem; align-items: flex-start; }
  .consent-line input { width: auto; margin-top: 0.2rem; }

  /* ── App shell ────────────────────────────────────────────────── */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 0.9rem 1.25rem;
    border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 20; }
  .logo { font-size: 1.7rem; color: var(--hazard); }
  .topbar-right { display: flex; align-items: center; gap: 0.75rem; }
  .streak-pill { font-family: var(--font-mono); font-size: 0.85rem; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 0.3rem 0.8rem; }

  .tab-nav { display: flex; gap: 0.15rem; overflow-x: auto; padding: 0 0.75rem; background: var(--surface);
    border-bottom: 1px solid var(--border); position: sticky; top: 57px; z-index: 19; }
  .tab-btn { font-family: var(--font-display); letter-spacing: 0.03em; font-size: 1.05rem; padding: 0.55rem 0.9rem;
    border-radius: 8px 8px 0 0; background: transparent; border: none; color: var(--text-dim); cursor: pointer; white-space: nowrap; }
  .tab-btn.active { color: var(--hazard); background: var(--surface-2); }

  main.tab-panels { padding: 1.25rem; max-width: 880px; margin: 0 auto; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── Plate scoreboard ─────────────────────────────────────────── */
  .scoreboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.75rem; margin-bottom: 1.25rem; }
  .plate { display: flex; flex-direction: column; align-items: center; gap: 0.35rem; }
  .ring-wrap { width: 104px; height: 104px; position: relative; }
  .ring-wrap svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  .ring-track { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 10; }
  .ring-progress { fill: none; stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
  .ring-inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-value { font-family: var(--font-mono); font-size: 1.05rem; font-weight: 600; }
  .ring-goal { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-dim); }
  .plate-label { font-family: var(--font-display); letter-spacing: 0.05em; color: var(--text-dim); font-size: 0.85rem; }

  /* ── Lists ────────────────────────────────────────────────────── */
  .log-row { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 0; border-bottom: 1px solid var(--border); gap: 0.75rem; }
  .log-row:last-child { border-bottom: none; }
  .log-row .name { font-weight: 600; }
  .log-row .macros { font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-dim); }
  .chip-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .chip { background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 0.4rem 0.8rem;
    cursor: pointer; font-size: 0.85rem; }
  .chip:hover { border-color: var(--hazard); }

  .sub-nav { display: flex; gap: 0.4rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .sub-nav button { flex: none; }

  table.plain { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  table.plain th, table.plain td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--border); }
  table.plain th { color: var(--text-dim); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em; }

  .guide-card { border-left: 3px solid var(--hazard); }
  .guide-card.caution { border-left-color: var(--red); }
  .guide-card .col-title { display: flex; align-items: center; gap: 0.6rem; }
  .caution-box { background: rgba(224,72,60,0.1); border: 1px solid rgba(224,72,60,0.4); border-radius: 8px; padding: 0.6rem 0.8rem; margin-top: 0.6rem; font-size: 0.85rem; }

  .ask-msg { padding: 0.75rem 0.9rem; border-radius: 10px; margin-bottom: 0.6rem; max-width: 90%; font-size: 0.9rem; line-height: 1.4; }
  .ask-msg.user { background: var(--surface-3); margin-left: auto; }
  .ask-msg.assistant { background: var(--surface-2); border: 1px solid var(--border); }

  footer.legal { text-align: center; padding: 2rem 1rem; color: var(--text-dim); font-size: 0.78rem; }
  footer.legal a { color: var(--text-dim); text-decoration: underline; }

  @media (max-width: 480px) {
    .ring-wrap { width: 82px; height: 82px; }
    .ring-value { font-size: 0.9rem; }
  }
</style>
</head>
<body>

<div id="authScreen">

    </div>

    <form id="authForm">
      <div class="field" id="displayNameField" style="display:none;">
        <label for="displayName">Display name</label>
        <input class="input" id="displayName" type="text" autocomplete="nickname" placeholder="What should we call you?">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input class="input" id="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input class="input" id="password" type="password" autocomplete="current-password" minlength="6" required>
      </div>

</div>

<div id="app" class="hidden">
  <div class="topbar">
    <div class="logo">PLATED</div>

      <button class="btn btn-sm" id="signOutBtn">Sign Out</button>

  </div>

  <nav class="tab-nav" id="tabNav">
    <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
    <button class="tab-btn" data-tab="log">Log Food</button>
    <button class="tab-btn" data-tab="history">History</button>
    <button class="tab-btn" data-tab="weight">Weight</button>
    <button class="tab-btn" data-tab="supplements">Supplements</button>
    <button class="tab-btn" data-tab="meals">Meals</button>
    <button class="tab-btn" data-tab="ask">Ask AI</button>
    <button class="tab-btn" data-tab="profile">Profile</button>
  </nav>

  <main class="tab-panels">
    <section class="tab-panel active" data-tab="dashboard" id="panel-dashboard"></section>
    <section class="tab-panel" data-tab="log" id="panel-log"></section>
    <section class="tab-panel" data-tab="history" id="panel-history"></section>
    <section class="tab-panel" data-tab="weight" id="panel-weight"></section>
    <section class="tab-panel" data-tab="supplements" id="panel-supplements"></section>
    <section class="tab-panel" data-tab="meals" id="panel-meals"></section>
    <section class="tab-panel" data-tab="ask" id="panel-ask"></section>
    <section class="tab-panel" data-tab="profile" id="panel-profile"></section>
  </main>

  <footer class="legal">
    Plated is not a medical device and does not provide medical advice.
    <a href="TERMS_OF_SERVICE.md">Terms</a> · <a href="PRIVACY_POLICY.md">Privacy</a>
  </footer>
</div>

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const round = (n, d = 0) => { const f = 10 ** d; return Math.round((Number(n) || 0) * f) / f; };

function toast(msg, ms = 3200) {
  let t = $('#toastEl');
  if (t) t.remove();
  t = document.createElement('div');
  t.id = 'toastEl';
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}

function localDateStr(d = new Date()) {
  const yr = d.getFullYear(), mo = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
  return `${yr}-${mo}-${day}`;
}

// ══════════════════════════════════════════════════════════════════
// AUTH
// ══════════════════════════════════════════════════════════════════
let authMode = 'signin';

$('#toggleSignIn').addEventListener('click', () => setAuthMode('signin'));
$('#toggleSignUp').addEventListener('click', () => setAuthMode('signup'));

function setAuthMode(mode) {
  authMode = mode;
  $('#toggleSignIn').classList.toggle('active', mode === 'signin');
  $('#toggleSignUp').classList.toggle('active', mode === 'signup');
  $('#displayNameField').style.display = mode === 'signup' ? 'block' : 'none';
  $('#consentField').style.display = mode === 'signup' ? 'flex' : 'none';
  $('#authSubmitBtn').textContent = mode === 'signup' ? 'Create Account' : 'Sign In';
  $('#authError').textContent = '';
  $('#authNote').textContent = '';
}

$('#authForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('#authError').textContent = '';
  $('#authNote').textContent = '';
  const email = $('#email').value.trim();
  const password = $('#password').value;
  const btn = $('#authSubmitBtn');
  btn.disabled = true;

  try {
    if (authMode === 'signup') {
      if (!$('#consentCheck').checked) {
        throw new Error('Please agree to the Terms and Privacy Policy to continue.');
      }
      const displayName = $('#displayName').value.trim() || 'Athlete';
      const { data, error } = await supabase.auth.signUp({
        email, password, options: { data: { display_name: displayName } },
      });
      if (error) throw error;
      // Only write profile/goals rows here if sign-up produced an active
      // session (email confirmation disabled). If confirmation is required,
      // auth.uid() is null until the user confirms + signs in, so an insert
      // here would just be rejected by RLS — ensureProfileAndGoals() below
      // creates these rows on first real sign-in instead, using the
      // display_name stashed in user metadata above.
      if (data.session) {
        await ensureProfileAndGoals(data.user, displayName);
      } else {
        $('#authNote').textContent = 'Account created! Check your email to confirm, then sign in.';
        setAuthMode('signin');
      }
    } else {
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw error;
    }
  } catch (err) {
    $('#authError').textContent = err.message || 'Something went wrong.';
  } finally {
    btn.disabled = false;
  }
});

$('#signOutBtn').addEventListener('click', async () => {
  await supabase.auth.signOut();
});

supabase.auth.onAuthStateChange((_event, session) => {
  state.session = session;
  state.user = session?.user || null;
  if (session) {
    $('#authScreen').classList.add('hidden');
    $('#app').classList.remove('hidden');
    bootstrapApp();
  } else {
    $('#app').classList.add('hidden');
    $('#authScreen').classList.remove('hidden');
  }
});

// Idempotent: creates a profile + default goals row the first time a user
// actually has an authenticated session (covers both the "no email
// confirmation needed" signup path and the "confirm, then sign in" path).
async function ensureProfileAndGoals(user, displayNameHint) {
  const { data: existing } = await supabase.from('profiles').select('id').eq('id', user.id).maybeSingle();
  if (existing) return;
  const display_name = displayNameHint || user.user_metadata?.display_name || 'Athlete';
  await supabase.from('profiles').insert({ id: user.id, display_name });
  await supabase.from('goals').insert({ user_id: user.id });

// ══════════════════════════════════════════════════════════════════
// SHARED: sum + streaks
// ══════════════════════════════════════════════════════════════════
function sumMacros(logs) {
  return logs.reduce((acc, l) => {
    acc.calories += Number(l.calories) || 0;
    acc.protein_g += Number(l.protein_g) || 0;
    acc.carbs_g += Number(l.carbs_g) || 0;
    acc.fat_g += Number(l.fat_g) || 0;
    return acc;
  }, { calories: 0, protein_g: 0, carbs_g: 0, fat_g: 0 });
}

function groupByDay(logs) {
  const map = new Map();
  for (const l of logs) {
    const day = localDateStr(new Date(l.logged_at));
    if (!map.has(day)) map.set(day, []);
    map.get(day).push(l);
  }
  return map;
}

function computeStreaks(logs, proteinGoal) {
  const byDay = groupByDay(logs);
  const today = localDateStr();
  const days = Array.from(byDay.keys()).sort(); // ascending
  const metGoal = new Set();
  for (const [day, dayLogs] of byDay) {
    if (sumMacros(dayLogs).protein_g >= proteinGoal) metGoal.add(day);
  }

  // Best streak: longest run of consecutive calendar days in metGoal.
  let best = 0, run = 0, prev = null;
  for (const day of days) {
    if (prev) {
      const prevDate = new Date(prev), curDate = new Date(day);
      const diffDays = Math.round((curDate - prevDate) / 86400000);
      if (diffDays !== 1) run = 0;
    }
    if (metGoal.has(day)) { run += 1; best = Math.max(best, run); } else { run = 0; }
    prev = day;
  }

  // Current streak: walk backward from today; today not yet meeting goal doesn't break it
  // (the day isn't over), any earlier missed day does.
  let current = 0;
  const cursor = new Date();
  let first = true;
  while (true) {
    const dayStr = localDateStr(cursor);
    if (metGoal.has(dayStr)) {
      current += 1;
    } else if (first && dayStr === today) {
      // today not logged/met yet — skip without breaking the streak
    } else {
      break;
    }
    first = false;
    cursor.setDate(cursor.getDate() - 1);
  }

  return { current, best };
}

function updateStreakPill() {
  const { current } = computeStreaks(state.historyLogs, state.goals.protein_g);
  $('#streakPill').textContent = `🔥 ${current} day streak`;
}

// ══════════════════════════════════════════════════════════════════
// RING SVG
// ══════════════════════════════════════════════════════════════════
function ringSvg(pct, color) {
  const r = 46, c = 2 * Math.PI * r;
  const clamped = Math.max(0, Math.min(1, pct));
  const offset = c * (1 - clamped);
  return `<svg viewBox="0 0 104 104">
    <circle class="ring-track" cx="52" cy="52" r="${r}"></circle>
    <circle class="ring-progress" cx="52" cy="52" r="${r}" stroke="${color}"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}"></circle>
  </svg>`;
}

function plateHtml(label, value, goal, color) {
  const pct = goal > 0 ? value / goal : 0;
  return `<div class="plate">
    <div class="ring-wrap">
      ${ringSvg(pct, color)}
      <div class="ring-inner">
        <div class="ring-value">${round(value)}</div>
        <div class="ring-goal">/ ${round(goal)}</div>
      </div>
    </div>
    <div class="plate-label">${label}</div>
  </div>`;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result; // data:image/jpeg;base64,xxxx
      const [, mediaType] = /^data:([^;]+);base64,/.exec(result) || [];
      const base64 = result.split(',')[1];
      resolve({ base64, mediaType: mediaType || file.type });
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function callFunction(name, body) {
  const token = state.session?.access_token;
  const res = await fetch(`/.netlify/functions/${name}`, {
    method: 'POST',
    headers: { 'content-type': 'application/json', Authorization: `Bearer ${token}` },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

        const dayLogs = byDay.get(day);
        const totals = sumMacros(dayLogs);
        const met = totals.protein_g >= state.goals.protein_g;
        return `<div style="margin-top:0.9rem;">
          <div class="row" style="align-items:center;">
            <strong>${day}</strong>
            <span class="badge ${met ? 'on' : ''}">${round(totals.protein_g)}g protein</span>
            <span class="muted">${round(totals.calories)} kcal</span>
          </div>
          ${dayLogs.map((l) => `<div class="log-row"><div class="name">${esc(l.food_name)}</div><div class="macros">${round(l.calories)} kcal · P${round(l.protein_g)} C${round(l.carbs_g)} F${round(l.fat_g)}</div></div>`).join('')}
        </div>`;
      }).join('')}
    </div>
  `;

  $('#exportCsvBtn')?.addEventListener('click', exportHistoryCsv);
}

function exportHistoryCsv() {
  const header = ['Date', 'Time', 'Food', 'Calories', 'Protein (g)', 'Carbs (g)', 'Fat (g)', 'Source'];
  const rows = state.historyLogs.map((l) => {
    const d = new Date(l.logged_at);
    return [localDateStr(d), d.toLocaleTimeString(), l.food_name, round(l.calories), round(l.protein_g), round(l.carbs_g), round(l.fat_g), l.source];
  });
  const csv = [header, ...rows].map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `plated-history-${localDateStr()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

async function upsertBodyStatsWeight(weight_lb) {
  const weight_kg = round(weight_lb * 0.453592, 2);
  await supabase.from('body_stats').upsert({ user_id: state.user.id, weight_kg, updated_at: new Date().toISOString() });
  await loadBodyStats();
}

function weightChartSvg(sorted) {
  const w = 600, h = 200, pad = 24;
  const weights = sorted.map((s) => s.weight_lb);
  const min = Math.min(...weights), max = Math.max(...weights);
  const span = max - min || 1;
  const points = sorted.map((s, i) => {
    const x = pad + (i / (sorted.length - 1)) * (w - pad * 2);
    const y = h - pad - ((s.weight_lb - min) / span) * (h - pad * 2);
    return `${x},${y}`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;">
    <polyline points="${points.join(' ')}" fill="none" stroke="var(--hazard)" stroke-width="2.5" />
    ${points.map((p) => `<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="3" fill="var(--hazard)" />`).join('')}
    <text x="${pad}" y="14" fill="var(--text-dim)" font-size="11" font-family="monospace">${round(max, 1)} lb</text>
    <text x="${pad}" y="${h - 8}" fill="var(--text-dim)" font-size="11" font-family="monospace">${round(min, 1)} lb</text>
  </svg>`;
}

// ASK YOUR DATA TAB
// ══════════════════════════════════════════════════════════════════
let askMessages = [];

function renderAsk() {
  const panel = $('#panel-ask');
  panel.innerHTML = `
    <div class="card">
      <h3>Ask Your Data</h3>
      <p class="muted">Ask questions about your own logged history — grounded only in what you've actually logged.</p>
      <div id="askThread" style="margin:1rem 0;">${askMessages.map((m) => `<div class="ask-msg ${m.role}">${esc(m.text)}</div>`).join('')}</div>
      <div class="row">
        <input class="input" id="askInput" placeholder="e.g. how's my protein trending this week?">
        <button class="btn btn-primary" id="askBtn" style="flex:none;">Ask</button>
      </div>
      <div id="askError" class="muted" style="color:var(--red);margin-top:0.5rem;"></div>
    </div>
  `;
  $('#askBtn').addEventListener('click', handleAsk);
  $('#askInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') handleAsk(); });
}

async function buildDataSummary() {
  const lines = [];
  lines.push(`Goals: ${round(state.goals.calories)} kcal, P${round(state.goals.protein_g)}g C${round(state.goals.carbs_g)}g F${round(state.goals.fat_g)}g`);

  const byDay = groupByDay(state.historyLogs);
  const days = Array.from(byDay.keys()).sort().reverse().slice(0, 30);
  lines.push('\nDaily totals (most recent first):');
  for (const day of days) {
    const t = sumMacros(byDay.get(day));
    lines.push(`${day}: ${round(t.calories)} kcal, P${round(t.protein_g)}g C${round(t.carbs_g)}g F${round(t.fat_g)}g`);
  }

  if (state.weightLog.length) {
    lines.push('\nRecent weight entries (lb):');
    state.weightLog.slice(0, 10).forEach((w) => lines.push(`${w.logged_date}: ${round(w.weight_lb, 1)} lb`));
  }

  if (state.supplementLogs.length) {
    lines.push('\nSupplements logged in the last 14 days:');
    const counts = {};
    state.supplementLogs.forEach((s) => { counts[s.supplement_name] = (counts[s.supplement_name] || 0) + 1; });
    Object.entries(counts).forEach(([name, n]) => lines.push(`${name}: ${n}x`));
  }

  return lines.join('\n').slice(0, 7000);
}

async function handleAsk() {
  const input = $('#askInput');
  const question = input.value.trim();
  if (!question) return;
  $('#askError').textContent = '';
  askMessages.push({ role: 'user', text: question });
  renderAsk();
  input.value = '';
  const btn = $('#askBtn'); if (btn) { btn.disabled = true; btn.textContent = 'Thinking…'; }

  try {
    const dataSummary = await buildDataSummary();
    const result = await callFunction('ask-data', { question, dataSummary });
    state.aiRemaining = result.remaining;
    askMessages.push({ role: 'assistant', text: result.answer });
    renderAsk();
  } catch (err) {
    $('#askError').textContent = err.message;
  }
}

// ══════════════════════════════════════════════════════════════════
// PROFILE TAB
// ══════════════════════════════════════════════════════════════════
const ACTIVITY_MULTIPLIERS = { sedentary: 1.2, light: 1.375, moderate: 1.55, active: 1.725, very_active: 1.9 };

function renderProfile() {
  const panel = $('#panel-profile');
  const p = state.profile || {};
  const bs = state.bodyStats || {};
  panel.innerHTML = `
    <div class="card">
      <h3>Profile</h3>
      <div class="field"><label>Display name</label><input class="input" id="prof_name" value="${esc(p.display_name || '')}"></div>
      <button class="btn" id="prof_save">Save</button>
    </div>

    <div class="card">
      <h3>Goals</h3>
      <div class="row">
        <div class="field"><label>Calories</label><input class="input mono" id="goal_cal" type="number" value="${round(state.goals.calories)}"></div>
        <div class="field"><label>Protein (g)</label><input class="input mono" id="goal_pro" type="number" value="${round(state.goals.protein_g)}"></div>
        <div class="field"><label>Carbs (g)</label><input class="input mono" id="goal_carb" type="number" value="${round(state.goals.carbs_g)}"></div>
        <div class="field"><label>Fat (g)</label><input class="input mono" id="goal_fat" type="number" value="${round(state.goals.fat_g)}"></div>
      </div>
      <button class="btn btn-primary" id="goal_save">Save Goals</button>
    </div>

    <div class="card">
      <h3>Goal Calculator</h3>
      <p class="muted">Mifflin-St Jeor based estimate. Calorie target is never recommended below your resting metabolic rate or 1500 kcal, whichever is higher.</p>
      <div class="row">
        <div class="field"><label>Age</label><input class="input mono" id="calc_age" type="number" value="${p.age || ''}"></div>
        <div class="field"><label>Sex</label>
          <select id="calc_sex">
            <option value="male" ${p.sex === 'male' ? 'selected' : ''}>Male</option>
            <option value="female" ${p.sex === 'female' ? 'selected' : ''}>Female</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="field"><label>Height (ft)</label><input class="input mono" id="calc_height_ft" type="number" value="${p.height_cm ? Math.floor(round(p.height_cm / 2.54 / 12, 0)) : ''}"></div>
        <div class="field"><label>Height (in)</label><input class="input mono" id="calc_height_in" type="number" min="0" max="11" value="${p.height_cm ? round((round(p.height_cm / 2.54, 1) % 12), 1) : ''}"></div>
        <div class="field"><label>Weight (lb)</label><input class="input mono" id="calc_weight" type="number" value="${bs.weight_kg ? round(bs.weight_kg / 0.453592, 1) : ''}"></div>
      </div>
      <div class="row">
        <div class="field"><label>Activity level</label>
          <select id="calc_activity">
            <option value="sedentary" ${p.activity_level === 'sedentary' ? 'selected' : ''}>Sedentary</option>
            <option value="light" ${p.activity_level === 'light' ? 'selected' : ''}>Light (1-3 days/wk)</option>
            <option value="moderate" ${!p.activity_level || p.activity_level === 'moderate' ? 'selected' : ''}>Moderate (3-5 days/wk)</option>
            <option value="active" ${p.activity_level === 'active' ? 'selected' : ''}>Active (6-7 days/wk)</option>
            <option value="very_active" ${p.activity_level === 'very_active' ? 'selected' : ''}>Very Active (2x/day training)</option>
          </select>
        </div>
        <div class="field"><label>Goal Weight (lb)</label><input class="input mono" id="calc_goal_weight" type="number" placeholder="e.g. 185"></div>
      </div>
      <button class="btn" id="calc_run">Calculate</button>
      <div id="calc_result" style="margin-top:1rem;"></div>
    </div>

    <div class="card">
      <h3>Account</h3>
      <p class="muted">Signed in as ${esc(state.user.email)}</p>
      <button class="btn btn-danger" id="delete_account_btn">Delete My Account</button>
      <div id="delete_confirm" class="hidden" style="margin-top:0.75rem;">
        <p class="muted">This permanently deletes your account and all logged data. Type DELETE to confirm.</p>
        <input class="input" id="delete_confirm_input" style="margin-bottom:0.5rem;">
        <button class="btn btn-danger" id="delete_confirm_btn">Permanently Delete</button>
      </div>
    </div>
  `;

  $('#prof_save').addEventListener('click', async () => {
    const display_name = $('#prof_name').value.trim() || 'Athlete';
    const { error } = await supabase.from('profiles').upsert({ id: state.user.id, display_name });
    if (error) return toast('Could not save: ' + error.message);
    toast('Profile saved');
    await loadProfile();
  });

  $('#goal_save').addEventListener('click', async () => {
    const goals = {
      user_id: state.user.id,
      calories: Number($('#goal_cal').value) || 0,
      protein_g: Number($('#goal_pro').value) || 0,
      carbs_g: Number($('#goal_carb').value) || 0,
      fat_g: Number($('#goal_fat').value) || 0,
      updated_at: new Date().toISOString(),
    };
    const { error } = await supabase.from('goals').upsert(goals);
    if (error) return toast('Could not save goals: ' + error.message);
    toast('Goals updated');
    await loadGoals();
    renderAll();
  });

  $('#calc_run').addEventListener('click', async () => {
    const age = Number($('#calc_age').value);
    const sex = $('#calc_sex').value;
    const heightFt = Number($('#calc_height_ft').value) || 0;
    const heightIn = Number($('#calc_height_in').value) || 0;
    const totalHeightIn = heightFt * 12 + heightIn;
    const weightLb = Number($('#calc_weight').value);
    const goalWeightLb = Number($('#calc_goal_weight').value);
    const activity = $('#calc_activity').value;

    if (!age || totalHeightIn <= 0 || !weightLb || !goalWeightLb) {
      $('#calc_result').innerHTML = `<p class="muted" style="color:var(--red);">Fill in age, height, weight, and goal weight first.</p>`;
      return;
    }

    const heightCm = totalHeightIn * 2.54;
    const weightKg = weightLb * 0.453592;
    const bmr = sex === 'male'
      ? 10 * weightKg + 6.25 * heightCm - 5 * age + 5
      : 10 * weightKg + 6.25 * heightCm - 5 * age - 161;
    const tdee = bmr * ACTIVITY_MULTIPLIERS[activity];
    const weightDiff = goalWeightLb - weightLb;
    const adjusted = Math.abs(weightDiff) < 2 ? tdee : weightDiff > 0 ? tdee + 300 : tdee - 500;

    // Safety floor: never recommend below resting metabolic rate or 1500, whichever is higher.
    const safetyFloor = Math.max(bmr, 1500);
    const targetCalories = Math.round(Math.max(adjusted, safetyFloor) / 10) * 10;

    const proteinG = Math.round(weightLb * 1.0);
    const fatG = Math.round((targetCalories * 0.25) / 9);
    const remaining = Math.max(targetCalories - proteinG * 4 - fatG * 9, 0);
    const carbsG = Math.round(remaining / 4);

    const goalMode = Math.abs(weightDiff) < 2 ? 'maintain' : weightDiff > 0 ? 'gain' : 'lose';
    const goalModeLabel = goalMode === 'maintain' ? 'Maintain weight' : goalMode === 'gain' ? 'Gain weight' : 'Lose weight';
    const weightDiffAbs = Math.abs(weightDiff).toFixed(1);

    $('#calc_result').innerHTML = `
      <div class="row">
        <span class="badge on">${targetCalories} kcal</span>
        <span class="badge">P ${proteinG}g</span>
        <span class="badge">C ${carbsG}g</span>
        <span class="badge">F ${fatG}g</span>
      </div>
      <p class="muted" style="margin-top:0.5rem;">BMR ${Math.round(bmr)} kcal · TDEE ${Math.round(tdee)} kcal · Goal: ${goalModeLabel} (${Math.abs(weightDiff) >= 2 ? weightDiff > 0 ? '+' : '−' : ''}${weightDiffAbs} lb)${adjusted < safetyFloor ? ' · adjusted up to the safety floor' : ''}</p>
      <button class="btn btn-primary" id="calc_apply" style="margin-top:0.5rem;">Apply to My Goals</button>
    `;

    $('#calc_apply').addEventListener('click', async () => {
      await supabase.from('profiles').upsert({ id: state.user.id, age, sex, height_cm: round(heightCm, 1), activity_level: activity });
      await supabase.from('body_stats').upsert({ user_id: state.user.id, weight_kg: round(weightKg, 2), updated_at: new Date().toISOString() });
      await supabase.from('goals').upsert({ user_id: state.user.id, calories: targetCalories, protein_g: proteinG, carbs_g: carbsG, fat_g: fatG, updated_at: new Date().toISOString() });
      toast('Goals updated from calculator');
      await Promise.all([loadProfile(), loadBodyStats(), loadGoals()]);
      renderAll();
    });
  });

  $('#delete_account_btn').addEventListener('click', () => $('#delete_confirm').classList.remove('hidden'));
  $('#delete_confirm_btn').addEventListener('click', async () => {
    if ($('#delete_confirm_input').value !== 'DELETE') return toast('Type DELETE exactly to confirm.');
    try {
      await callFunction('delete-account', {});
      await supabase.auth.signOut();
      toast('Account deleted.');
    } catch (err) {
      toast('Could not delete account: ' + err.message);
    }
  });
}

    state.session = data.session;
    state.user = data.session.user;
    $('#authScreen').classList.add('hidden');
    $('#app').classList.remove('hidden');

  }
});
