[build]
  publish = "."
  functions = "netlify/functions"
  # Deploy credits are burned by every build Netlify actually runs —
  # production deploys, deploy previews, AND branch deploys — regardless
  # of the Dashboard's "Deploy contexts" setting for the latter two. This
  # `ignore` command is Netlify's own supported way to skip a build
  # entirely (a skipped build costs no credits): it exits 1 ("don't skip —
  # build it") only when $BRANCH is main, and exits 0 ("skip it") for
  # every other branch, which covers both deploy previews (built on the
  # PR's own branch) and branch deploys. This is a repo-side, version-
  # controlled backstop — it doesn't replace turning off Deploy Previews/
  # Branch deploys in Site settings -> Build & deploy -> Continuous
  # deployment, it just guarantees the same outcome even if that dashboard
  # setting ever gets flipped back on by mistake.
  ignore = "if [ \"$BRANCH\" = \"main\" ]; then exit 1; else exit 0; fi"

[functions]
  node_bundler = "esbuild"

# Runs once/day at a fixed UTC time (there's no per-user timezone stored,
# so this is an approximation of "evening" — see the comment in
# send-reminder-emails.js). 01:00 UTC lands in the evening for US timezones;
# adjust to fit your actual user base.
[functions."send-reminder-emails"]
  schedule = "0 1 * * *"

# Group Mode's daily streak/freeze evaluation — runs shortly after
# send-reminder-emails so "yesterday" is unambiguously over for the same
# fixed-UTC-day approximation. See the comment in evaluate-groups.js.
[functions."evaluate-groups"]
  schedule = "30 1 * * *"

# Items 3+4 of the AI cost-efficiency batch: nightly rule-based training
# insights, computed after evaluate-groups so "today" is fully logged by
# the time this runs. Pure arithmetic over already-logged data (no AI call),
# which is exactly why this can run as a batch instead of on-demand. See
# the comment in compute-training-insights.js.
[functions."compute-training-insights"]
  schedule = "0 2 * * *"

[[headers]]
  for = "/plated/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# The installed home-screen app (Add to Home Screen) re-fetches this exact
# URL on every launch. Without an explicit no-cache directive, iOS's
# standalone-mode WebKit can pin a stale copy of the app shell at the
# OS/network level — a bug that survives deleting and reinstalling the
# home-screen icon, since that cache isn't tied to the icon itself.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
